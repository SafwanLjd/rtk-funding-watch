[project]
name = "rtk-funding-watch"
version = "0.1.0"
description = "Watchdog that scrapes RTK (rtk.ee) funding calls and republishes them in machine-readable formats (JSON, TOON, CSV, RSS) plus an MCP server and a static site."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Safwan Eljad", email = "eljadisafwan@gmail.com" }]
keywords = ["rtk", "funding", "grants", "estonia", "scraper", "mcp", "toon", "open-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "toon-format>=1.0,<2",
    "mcp[cli]>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/SafwanLjd/rtk-funding-watch"
Repository = "https://github.com/SafwanLjd/rtk-funding-watch"

[project.scripts]
rtk-watch = "rtk_funding_watch.cli:app"
rtk-funding-mcp = "rtk_funding_watch.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.16.10",
    "pre-commit>=4.0",
    "commitizen>=3.27",
    "codespell>=2.3",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtk_funding_watch"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "TID"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bs4.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["rtk_funding_watch"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_scheme = "semver"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.codespell]
# Estonian source data would trip an English spell-checker; scope to code/docs.
skip = ".git,.venv,site,data,uv.lock,*.csv,*.json,*.toon,tests/fixtures"
