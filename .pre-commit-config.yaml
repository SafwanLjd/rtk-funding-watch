# Install all hook types (incl. commit-msg) with a single `pre-commit install`.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ---- Ruff: lint + format ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---- Hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # ---- Spelling (scoped away from Estonian data in pyproject [tool.codespell]) ----
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--toml=pyproject.toml]

  # ---- Conventional Commits enforcement (commit-msg stage) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ---- Mypy: local hook via uv so it sees the project's real dependencies ----
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
